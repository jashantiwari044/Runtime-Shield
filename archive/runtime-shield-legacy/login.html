<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runtime Shield — Sign In</title>
  <meta name="description" content="Sign in to Runtime Shield MCP Gateway — secured by Keycloak identity platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #07080f;
      --surface:     rgba(18, 20, 35, 0.85);
      --border:      rgba(99, 102, 241, 0.25);
      --indigo:      #6366f1;
      --indigo-d:    #4f46e5;
      --indigo-l:    #818cf8;
      --text:        #e2e8f0;
      --muted:       #64748b;
      --radius:      16px;
    }
    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    .bg-canvas { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .bg-canvas::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%,  rgba(99,102,241,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139,92,246,.14) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%,  rgba(16,185,129,.06) 0%, transparent 60%);
      animation: shift 12s ease-in-out infinite alternate;
    }
    @keyframes shift { 0% { transform: scale(1) rotate(0deg); } 100% { transform: scale(1.05) rotate(2deg); } }
    .bg-canvas::after {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(99,102,241,.15) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: float 8s ease-in-out infinite; pointer-events: none; }
    .orb-1 { width: 500px; height: 500px; background: rgba(99,102,241,.12); top: -150px; left: -150px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: rgba(139,92,246,.10); bottom: -100px; right: -100px; animation-delay: -3s; }
    .orb-3 { width: 300px; height: 300px; background: rgba(16,185,129,.07); top: 40%; left: 60%; animation-delay: -6s; }
    @keyframes float { 0%, 100% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-20px) scale(1.05); } 66% { transform: translate(-20px,15px) scale(.97); } }
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card {
      width: 100%; max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px 40px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 0 0 1px rgba(99,102,241,.08), 0 32px 64px rgba(0,0,0,.5), 0 0 80px rgba(99,102,241,.06);
      animation: rise 0.6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .logo-wrap { display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(99,102,241,.35), 0 0 0 1px rgba(99,102,241,.2);
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 8px 24px rgba(99,102,241,.35), 0 0 0 1px rgba(99,102,241,.2); }
      50%       { box-shadow: 0 8px 36px rgba(99,102,241,.55), 0 0 0 1px rgba(99,102,241,.4); }
    }
    .card-title {
      text-align: center; font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 6px;
      background: linear-gradient(135deg, #e2e8f0 30%, var(--indigo-l));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .card-sub { text-align: center; font-size: 13.5px; color: var(--muted); margin-bottom: 36px; line-height: 1.5; }
    .badges { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
    .badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; border: 1px solid; letter-spacing: .3px; }
    .badge-indigo { background: rgba(99,102,241,.12); color: var(--indigo-l); border-color: rgba(99,102,241,.3); }
    .badge-green  { background: rgba(16,185,129,.10); color: #34d399;        border-color: rgba(16,185,129,.3); }
    .badge-violet { background: rgba(139,92,246,.10); color: #c4b5fd;        border-color: rgba(139,92,246,.3); }
    .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(99,102,241,.25), transparent); }
    .divider-text { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; }
    .btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 20px; border-radius: 14px; font-family: inherit; font-size: 14.5px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent;
      transition: all .22s cubic-bezier(.22,1,.36,1);
      position: relative; overflow: hidden; letter-spacing: .1px;
    }
    .btn::after { content: ''; position: absolute; inset: 0; background: white; opacity: 0; transition: opacity .15s; }
    .btn:active::after { opacity: .05; }
    .btn:disabled { cursor: not-allowed; opacity: .55; }
    .btn-keycloak {
      background: linear-gradient(135deg, #4f46e5, #6d28d9);
      color: white; border-color: rgba(99,102,241,.4);
      box-shadow: 0 4px 20px rgba(99,102,241,.3), inset 0 1px 0 rgba(255,255,255,.12);
      margin-bottom: 12px;
    }
    .btn-keycloak:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,.45), inset 0 1px 0 rgba(255,255,255,.12); }
    .btn-google {
      background: rgba(255,255,255,.04); color: #e2e8f0;
      border-color: rgba(255,255,255,.12);
      box-shadow: 0 2px 12px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .btn-google:hover:not(:disabled) { transform: translateY(-2px); background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); box-shadow: 0 6px 24px rgba(0,0,0,.3); }
    .google-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .status-box {
      margin-top: 20px; padding: 12px 16px; border-radius: 12px;
      font-size: 13px; font-weight: 500; display: none; align-items: center; gap: 10px;
      animation: fadein .25s ease;
    }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .status-box.show { display: flex; }
    .status-box.info    { background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.3); color: var(--indigo-l); }
    .status-box.success { background: rgba(16,185,129,.10); border: 1px solid rgba(16,185,129,.3); color: #34d399; }
    .status-box.error   { background: rgba(239,68,68,.10);  border: 1px solid rgba(239,68,68,.3);  color: #f87171; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(99,102,241,.3); border-top-color: var(--indigo-l); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .session-banner {
      background: rgba(16,185,129,.10); border: 1px solid rgba(16,185,129,.3);
      border-radius: 14px; padding: 16px 18px; display: none; flex-direction: column; gap: 12px;
      margin-bottom: 24px; animation: fadein .3s ease;
    }
    .session-banner.show { display: flex; }
    .session-user { display: flex; align-items: center; gap: 10px; }
    .session-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #4f46e5, #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: white; flex-shrink: 0; }
    .session-info { flex: 1; }
    .session-name { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .session-role { font-size: 11px; color: #34d399; font-weight: 500; }
    .btn-continue { background: linear-gradient(135deg, #059669, #10b981); color: white; border-color: rgba(16,185,129,.4); box-shadow: 0 4px 16px rgba(16,185,129,.25); width: 100%; padding: 12px; font-size: 14px; font-weight: 600; border-radius: 12px; cursor: pointer; font-family: inherit; border: 1px solid rgba(16,185,129,.4); transition: all .2s; }
    .btn-continue:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(16,185,129,.35); }
    .btn-logout { background: transparent; border: none; color: var(--muted); font-size: 12px; cursor: pointer; font-family: inherit; text-decoration: underline; text-align: center; }
    .btn-logout:hover { color: #f87171; }
    .footer-note { margin-top: 28px; text-align: center; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
    .footer-note a { color: var(--indigo-l); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="bg-canvas">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="page">
  <div class="card" role="main">
    <div class="logo-wrap">
      <div class="logo-icon" aria-hidden="true">&#9889;</div>
    </div>
    <h1 class="card-title">Runtime Shield</h1>
    <p class="card-sub">Secure MCP Gateway &mdash; Sign in to continue</p>
    <div class="badges" aria-label="Security features">
      <span class="badge badge-indigo">&#128272; Keycloak JWKS</span>
      <span class="badge badge-green">&#128737; SPIFFE/SPIRE</span>
      <span class="badge badge-violet">&#128274; RBAC Enforced</span>
    </div>
    <!-- Active session banner -->
    <div class="session-banner" id="session-banner" role="status">
      <div class="session-user">
        <div class="session-avatar" id="session-avatar">?</div>
        <div class="session-info">
          <div class="session-name" id="session-name">Loading...</div>
          <div class="session-role" id="session-role">&#9679; Active session</div>
        </div>
      </div>
      <button class="btn-continue" id="btn-continue" onclick="goToChat()">Continue to Shield Chat &rarr;</button>
      <button class="btn-logout" onclick="logout()">Sign out &amp; use a different account</button>
    </div>
    <!-- Sign-in options -->
    <div id="sign-in-options">
      <div class="divider"><span class="divider-text">Sign in with</span></div>
      <button class="btn btn-keycloak" id="btn-keycloak" onclick="login('keycloak')" aria-label="Sign in with Keycloak">
        <span style="font-size:18px" aria-hidden="true">&#128273;</span>
        Continue with Keycloak
      </button>
      <button class="btn btn-google" id="btn-google" onclick="login('google')" aria-label="Sign in with Google">
        <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </div>
    <!-- Status feedback -->
    <div class="status-box" id="status-box" role="status" aria-live="polite">
      <div class="spinner" id="status-spinner" aria-hidden="true"></div>
      <span id="status-text"></span>
    </div>
    <p class="footer-note">
      Your identity is brokered by <a href="http://localhost:8080" target="_blank" rel="noopener">Keycloak</a>.<br />
      Tokens are RS256-signed and validated via JWKS.
    </p>
  </div>
</div>
<script>
  const CONFIG = {
    keycloakUrl: 'http://localhost:8080',
    realm:       'master',
    clientId:    'admin-cli',
    redirectUri: 'http://localhost:18080/callback',
    scopes: 'openid profile email tool:read_file tool:write_file tool:list_directory tool:keycloak_read tool:keycloak_admin tool:keycloak_report tool:admin_internal',
    chatPage:   'chat.html',
    tokenKey:   'shield_kc_token',
    roleKey:    'shield_runtime_role',
  };

  function decodeJwt(token) {
    try {
      const payload = token.split('.')[1];
      return JSON.parse(atob(payload.replace(/-/g,'+').replace(/_/g,'/')));
    } catch { return null; }
  }

  function isTokenValid(token) {
    if (!token) return false;
    const d = decodeJwt(token);
    return d && d.exp && (d.exp * 1000 > Date.now() + 30000);
  }

  function resolveRole(decoded) {
    const realm    = decoded?.realm_access?.roles || [];
    const resource = Object.values(decoded?.resource_access || {}).flatMap(r => r.roles || []);
    const scopes   = (decoded?.scope || '').split(' ');
    const all      = [...realm, ...resource, ...scopes].map(r => r.toLowerCase());
    return all.includes('admin') ? 'admin' : 'user';
  }

  function setStatus(type, text, spinner) {
    const box = document.getElementById('status-box');
    document.getElementById('status-spinner').style.display = spinner ? 'block' : 'none';
    document.getElementById('status-text').textContent = text;
    box.className = 'status-box show ' + type;
  }

  function clearStatus() { document.getElementById('status-box').className = 'status-box'; }

  function setButtonsDisabled(d) {
    ['btn-keycloak','btn-google'].forEach(id => { const el = document.getElementById(id); if(el) el.disabled = d; });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem(CONFIG.tokenKey);
    if (token && isTokenValid(token)) showActiveSession(token);
    handleCallback();
  });

  function showActiveSession(token) {
    const d = decodeJwt(token);
    const username = d?.preferred_username || d?.email || 'User';
    const role     = localStorage.getItem(CONFIG.roleKey) || resolveRole(d);
    document.getElementById('session-avatar').textContent = username[0].toUpperCase();
    document.getElementById('session-name').textContent   = username;
    document.getElementById('session-role').textContent   = '\u25cf ' + role.charAt(0).toUpperCase() + role.slice(1) + ' \u00b7 Session active';
    document.getElementById('session-banner').classList.add('show');
  }

  function goToChat() { window.location.href = CONFIG.chatPage; }
  function logout() {
    localStorage.removeItem(CONFIG.tokenKey);
    localStorage.removeItem(CONFIG.roleKey);
    document.getElementById('session-banner').classList.remove('show');
    clearStatus();
  }

  function generateState() {
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    const state = Array.from(arr, b => b.toString(16).padStart(2,'0')).join('');
    sessionStorage.setItem('shield_oauth_state', state);
    return state;
  }

  function login(provider) {
    clearStatus();
    setButtonsDisabled(true);
    setStatus('info', 'Redirecting to ' + (provider === 'google' ? 'Google' : 'Keycloak') + ' login\u2026', true);
    sessionStorage.setItem('shield_login_provider', provider);

    const params = new URLSearchParams({
      client_id:     CONFIG.clientId,
      response_type: 'code',
      scope:         CONFIG.scopes,
      redirect_uri:  CONFIG.redirectUri,
      prompt:        'login',
      state:         generateState(),
    });
    if (provider === 'google') params.set('kc_idp_hint', 'google');

    const authBase = CONFIG.keycloakUrl + '/realms/' + CONFIG.realm + '/protocol/openid-connect/auth';
    setTimeout(() => { window.location.href = authBase + '?' + params.toString(); }, 400);
  }

  async function handleCallback() {
    const params = new URLSearchParams(window.location.search);
    const code   = params.get('code');
    const error  = params.get('error');

    if (error) {
      setStatus('error', 'Auth error: ' + (params.get('error_description') || error));
      window.history.replaceState({}, '', window.location.pathname);
      return;
    }
    if (!code) return;

    setStatus('info', 'Exchanging code for token\u2026', true);
    setButtonsDisabled(true);
    window.history.replaceState({}, '', window.location.pathname);

    try {
      const tokenUrl = CONFIG.keycloakUrl + '/realms/' + CONFIG.realm + '/protocol/openid-connect/token';
      const body     = new URLSearchParams({
        grant_type:   'authorization_code',
        client_id:    CONFIG.clientId,
        code:         code,
        redirect_uri: CONFIG.redirectUri,
      });
      const resp = await fetch(tokenUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body:   body.toString(),
      });
      if (!resp.ok) {
        const t = await resp.text();
        throw new Error('Token exchange failed (' + resp.status + '): ' + t);
      }
      const data  = await resp.json();
      const token = data.access_token;
      if (!token) throw new Error('No access_token in Keycloak response');

      const decoded  = decodeJwt(token);
      const role     = resolveRole(decoded);
      const username = decoded?.preferred_username || decoded?.email || 'user';

      localStorage.setItem(CONFIG.tokenKey, token);
      localStorage.setItem(CONFIG.roleKey,  role);

      const provider = sessionStorage.getItem('shield_login_provider') || 'keycloak';
      sessionStorage.removeItem('shield_login_provider');

      setStatus('success', '\u2713 Signed in as ' + username + ' \u00b7 Role: ' + role + (provider === 'google' ? ' (via Google)' : ' (Keycloak)'));
      setTimeout(() => { window.location.href = CONFIG.chatPage; }, 1200);

    } catch(err) {
      console.error('[Shield Login]', err);
      setStatus('error', err.message || 'Login failed. Please try again.');
      setButtonsDisabled(false);
    }
  }
</script>
</body>
</html>
