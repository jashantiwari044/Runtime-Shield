name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check shield tests

      - name: Test
        run: pytest --cov=shield --cov-report=term-missing

      # The policy itself is under test. These three gates fail the build if a
      # config change opens a hole, breaks legitimate agent work, becomes
      # evadable by a rephrasing, or un-blocks traffic it used to stop.
      - name: Red-team the shipped policy
        run: shield test

      - name: Hunt for bypasses
        run: shield fuzz --seed 1

      - name: Verify the starter config is also sound
        run: |
          shield init -o /tmp/shield.yaml
          shield -c /tmp/shield.yaml test
          shield -c /tmp/shield.yaml fuzz --seed 1

      - name: Policy replay must not un-block past traffic
        run: |
          mkdir -p /tmp/replay && cd /tmp/replay
          cat > shield.yaml <<'EOF'
          audit: { enabled: true, path: traffic.jsonl, captureArguments: true }
          EOF
          shield check read_file --arg path=src/app.py  || true
          shield check exec --arg command='rm -rf /'    || true
          shield check http_get --arg url=https://api.github.com/x || true
          # Identical policy: must be a no-op diff and exit 0.
          shield replay --against shield.yaml
          # A policy that disables the command guard must exit 1.
          printf 'command:\n  enabled: false\n' > loose.yaml
          if shield replay --against loose.yaml; then
            echo "replay failed to flag a policy that opens a hole"; exit 1
          fi

      - name: CLI exits non-zero on a blocked call
        run: |
          shield check exec --arg command='rm -rf /' && exit 1 || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t runtime-shield:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name shield -p 8000:8000 runtime-shield:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break || sleep 1
          done
          curl -fsS -X POST http://localhost:8000/v1/check \
            -H 'content-type: application/json' \
            -d '{"tool":"exec","arguments":{"command":"rm -rf /"}}' | grep -q '"allowed":false'
          docker rm -f shield
