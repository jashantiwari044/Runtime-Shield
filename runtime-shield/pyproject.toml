[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runtime-shield"
version = "1.0.0"
description = "Runtime security for AI agents: guardrails, policy, and a tamper-evident audit trail."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["ai", "agents", "security", "guardrails", "llm", "mcp", "prompt-injection"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

# The core engine needs one dependency. Everything else is optional.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0", "httpx>=0.27"]
sign = ["cryptography>=42.0"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
all = ["runtime-shield[server,sign]"]
dev = [
  "runtime-shield[server,sign]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
shield = "shield.cli:main"
shield-mcp = "shield.integrations.mcp_proxy:main"

[project.urls]
Homepage = "https://github.com/YOUR-ORG/runtime-shield"
Documentation = "https://github.com/YOUR-ORG/runtime-shield#readme"
Issues = "https://github.com/YOUR-ORG/runtime-shield/issues"

[tool.hatch.build.targets.wheel]
packages = ["shield"]

[tool.hatch.build.targets.sdist]
include = ["shield", "tests", "README.md", "LICENSE", "shield.yaml", "pytest.ini"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4"]
ignore = [
  "E501",    # long lines are handled by the formatter
  "S101",    # asserts are fine in tests
  "B008",    # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"shield/guards/*" = ["S105", "S106"]   # pattern strings are not real secrets

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
  "ignore:.*starlette.testclient.*:UserWarning",
]

[tool.coverage.run]
source = ["shield"]
omit = ["shield/dashboard/*"]
